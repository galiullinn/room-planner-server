[project]
name = "room-planner-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.53",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "RUF001", 
    "RUF002", 
    "RUF003",
]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "ASYNC",
    "PTH",
    "RUF",
    "N",
]

[tool.mypy]
python_version = "3.13"

plugins = [
    "pydantic.mypy",
]
