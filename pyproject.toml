[project]
name = "room-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "timur", email = "tim.galiullin24@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src=["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "S", "PT", "FAST"]
ignore = ["RUF001", "RUF002", "RUF003",]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
plugins = [
    "pydantic.mypy",
]
strict = true